description: >-
  FinOps view of Superpower spend. Superpower is a consumer subscription, not a
  metered API platform, so there is no usage-based API billing to manage. Cost
  is a flat annual membership (publicly reported at $199/year base, $399/year in
  NY/NJ, formerly $499/year), HSA/FSA eligible, plus optional one-off add-on
  diagnostic tests. There are no per-token, per-request, or per-call meters
  because no public API exists. This artifact is intentionally minimal and not
  reconciled; it records subscription and add-on spend rather than API usage.
notes: >-
  Not reconciled. Membership pricing has changed over time and varies by
  region; verify against the Superpower site. Update this artifact only if
  Superpower introduces usage-based or API billing.
