principles:
- name: Visibility
  description: Track membership renewals and add-on test purchases from Superpower receipts; there is no API usage export.
- name: Allocation
  description: Allocate membership and add-on costs to the individual member or household using the account.
- name: Optimization
  description: Use HSA/FSA eligibility; weigh add-on tests against base membership value; review regional pricing differences.
- name: Accountability
  description: Review annual renewal pricing changes ($499 to $199) and confirm current rate before each renewal.
